<!DOCTYPE html>
<!-- SÓ DESENVOLVIMENTO: abre o index.html com prefers-reduced-motion neutralizado (CSS e JS), para revisar
     as animações quando o sistema operacional está com “reduzir movimento” ligado. Não faz parte do site. -->
<meta charset="utf-8"><title>motion preview</title>
<script>
(async function () {
  var html = await (await fetch('/index.html', { cache: 'no-store' })).text();
  var patch = '<base href="/"><script>(function(){var mm=window.matchMedia.bind(window);window.matchMedia=function(q){return /reduced-motion/.test(q)?{matches:false,media:q,addEventListener:function(){},removeEventListener:function(){},addListener:function(){},removeListener:function(){}}:mm(q)};})();<\/script>';
  var links = html.match(/<link rel="stylesheet" href="assets\/css\/[^"]+">/g) || [];
  for (var i = 0; i < links.length; i++) {
    var href = links[i].match(/href="([^"]+)"/)[1];
    var css = (await (await fetch('/' + href, { cache: 'no-store' })).text()).replace(/prefers-reduced-motion:\s*reduce/g, 'max-width:0px')
      .replace(/url\((['"]?)\.\.\//g, 'url($1/assets/');                 /* CSS embutido: refaz os caminhos relativos */
    html = html.replace(links[i], '<style data-from="' + href + '">' + css + '</style>');
  }
  html = html.replace('<head>', '<head>' + patch);
  /* ?open=1 abre o convite sozinho (sem som) quando o selo aparecer; ?scroll=1.5 rola 1,5 altura de tela depois */
  var q = new URLSearchParams(location.search);
  if (q.get('open')) html = html.replace('preload="auto" loop', 'preload="none" loop');      /* headless: download pendente congela o tempo virtual */
  if (q.get('open')) html = html.replace('</body>', '<script>(function(){var t=setInterval(function(){if(!document.querySelector(".wd-env.is-ready"))return;clearInterval(t);' +
    'try{localStorage.setItem("wd-sound","off")}catch(e){}document.getElementById("wd-openAlt").textContent;document.getElementById("wd-openBtn").click();' +
    (q.get('scroll') ? 'setTimeout(function(){var h=document.getElementById("inicio"),m=document.getElementById("site-main");m.scrollTop=innerHeight*' + (+q.get('scroll')) + ';m.dispatchEvent(new Event("scroll"));},3600);' : '') +
    '},100);})();<\/script></body>');
  if (q.get('debug')) html = html.replace('<head>', '<head><script>window.__err=[];addEventListener("error",function(e){__err.push(e.message+" @"+(e.filename||"").split("/").pop()+":"+e.lineno)});addEventListener("unhandledrejection",function(e){__err.push("promise: "+e.reason)});' +
    'setInterval(function(){var d=document.getElementById("__dbg");if(!d){d=document.createElement("pre");d.id="__dbg";d.style.cssText="position:fixed;right:8px;top:8px;z-index:999;background:#fff;color:#000;font:11px monospace;padding:6px;max-width:600px;white-space:pre-wrap";document.body&&document.body.appendChild(d)}' +
    'var a=document.getElementById("abertura");d.textContent="env: "+(a&&a.className)+"\\npct: "+(document.getElementById("wd-loaderPct")||{}).textContent+"\\nfonts: "+document.fonts.status+"\\nerr: "+__err.join(" | ")},200);<\/script>');
  document.open(); document.write(html); document.close();
})();
</script>
